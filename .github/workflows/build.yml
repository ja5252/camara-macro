name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite lanzar la compilación a mano desde la web

permissions:
  contents: write       # necesario para publicar el APK en "Releases"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias e instalar componentes
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk camara-macro.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Cámara Macro — última versión"
          body: "APK más reciente. Descárgalo en tu celular y ábrelo para instalar."
          files: camara-macro.apk

      - name: Guardar APK como artefacto (respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: camara-macro-apk
          path: camara-macro.apk
