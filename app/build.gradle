plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pepe.camaramacro'
    compileSdk 34

    defaultConfig {
        applicationId "com.pepe.camaramacro"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        camara {
            storeFile file('camara.keystore')
            storePassword 'camara123'
            keyAlias 'camara'
            keyPassword 'camara123'
        }
    }

    buildTypes {
        debug {
            // Firma con llave fija: permite actualizar sin desinstalar.
            signingConfig signingConfigs.camara
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.camara
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'io.coil-kt:coil:2.6.0'
}
